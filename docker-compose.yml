name: prompt_manager_${VERSION:-latest}
services:
  app:
    build: .
    container_name: prompt_manager_${VERSION:-latest}
    image: prompt-manager:${VERSION:-latest}
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY requise dans .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - ${HOST_PORT:-5000}:5000
    volumes:
      - ${DIR_BASE}/static/uploads:/app/static/uploads
      - ${DIR_BASE}/database:/app/database

    restart: unless-stopped
